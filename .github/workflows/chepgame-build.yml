# CHEPGAME.NET build workspace - trigger after overlay upload
name: Build CHEPGAME.NET PS5 Manager ELF

on:
  push:
    branches:
      - chepgame-build
    paths:
      - ".github/workflows/chepgame-build.yml"
      - "chepgame-build/min.part*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Reconstruct CHEPGAME.NET overlay
        shell: bash
        run: |
          set -euo pipefail
          cat chepgame-build/min.part00 chepgame-build/min.part01 chepgame-build/min.part02 | base64 -d > /tmp/chepgame-min.tar.gz
          gzip -t /tmp/chepgame-min.tar.gz
          echo "Overlay SHA256:"
          sha256sum /tmp/chepgame-min.tar.gz
          echo "Overlay files:"
          tar -tzf /tmp/chepgame-min.tar.gz

      - name: Clone upstream ProsperoMgr
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/notmaj0r/ProsperoMgr.git prospero
          git -C prospero rev-parse HEAD

      - name: Apply CHEPGAME.NET Vietnamese overlay
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/chepgame-min.tar.gz -C prospero
          chmod +x prospero/build_chepgame_docker.sh prospero/docker_inside_build.sh prospero/build_deps_docker.sh prospero/build_chepgame.sh
          test -f prospero/source/frontend/src/locales/vi-VN.json
          test -f prospero/Dockerfile.sdk

          # Match itsPLK/ps5-webkit-autoloader exactly here: build/install
          # the PS5 Payload SDK from source instead of using the binary ZIP.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("prospero/Dockerfile.sdk")
          s = p.read_text()
          start = s.index("# Official binary SDK release.")
          end = s.index("ENV PS5_PAYLOAD_SDK=", start)
          replacement = """# Build and install PS5 Payload SDK from source, matching itsPLK.
WORKDIR /opt
RUN git clone --depth 1 --branch v0.43 https://github.com/ps5-payload-dev/sdk.git ps5-payload-sdk-source && \\
    cd /opt/ps5-payload-sdk-source && \\
    make DESTDIR=/opt/ps5-payload-sdk install && \\
    test -f /opt/ps5-payload-sdk/toolchain/prospero.mk && \\
    test -x /opt/ps5-payload-sdk/bin/prospero-clang

"""
          p.write_text(s[:start] + replacement + s[end:])
          PY

          echo "CHEPGAME overlay applied; SDK source-build patch enabled."
          grep -n "ps5-payload-sdk-source" prospero/Dockerfile.sdk

      - name: Build PS5 ELF in isolated SDK container
        shell: bash
        run: |
          set -euo pipefail
          cd prospero
          ./build_chepgame_docker.sh

      - name: Verify ELF and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s prospero/build/ProsperoMgr.elf
          test -s prospero/build/CHEPGAME_NET_PS5_Manager.elf
          file prospero/build/CHEPGAME_NET_PS5_Manager.elf
          sha256sum -c prospero/build/CHEPGAME_NET_PS5_Manager.elf.sha256
          ls -lh prospero/build/ProsperoMgr.elf prospero/build/CHEPGAME_NET_PS5_Manager.elf
          cat prospero/build/CHEPGAME_NET_PS5_Manager.elf.sha256

      - name: Upload CHEPGAME.NET ELF
        uses: actions/upload-artifact@v4
        with:
          name: CHEPGAME_NET_PS5_Manager
          if-no-files-found: error
          retention-days: 30
          path: |
            prospero/build/CHEPGAME_NET_PS5_Manager.elf
            prospero/build/CHEPGAME_NET_PS5_Manager.elf.sha256
            prospero/build/ProsperoMgr.elf
